services:
  postgres:
    image: postgres:16
    container_name: common-postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./common-db/sql:/docker-entrypoint-initdb.d
    mem_limit: 1536m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-service:
    build:
      context: ./mock-service
    container_name: mock-service
    ports:
      - "9090:9090"
    mem_limit: 512m
    cpus: 0.5

  webflux-r2dbc:
    build:
      context: ./webflux-r2dbc
    container_name: webflux-r2dbc
    profiles:
      - webflux
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/orders_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      MOCK_SERVICE_BASE_URL: http://mock-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      mock-service:
        condition: service_started
    mem_limit: 1536m
    cpus: 2.0